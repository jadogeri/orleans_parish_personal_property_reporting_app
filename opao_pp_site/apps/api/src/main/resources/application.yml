# Tell Spring Boot to read your local .env file explicitly
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: pp_api
  docker:
    compose:
      enabled: false
  
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/opoppr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configurations
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate # 💡 Liquibase handles database structures now; Hibernate just checks them

  # Liquibase Migration Configuration
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.yaml" # 💡 Master tracking pipeline file
    drop-first: false # 💡 Defensive guard: keeps live tables intact instead of wiping them on reboot

server:
  port: 9000
