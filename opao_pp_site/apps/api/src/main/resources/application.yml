# Tell Spring Boot to read your local .env file explicitly
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: pp_api
  docker:
    compose:
      enabled: false
  
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/opoppr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configurations
#   jpa:
#     show-sql: true
#     hibernate:
#       ddl-auto: update
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 9000
