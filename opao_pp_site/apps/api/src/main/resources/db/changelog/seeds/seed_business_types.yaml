databaseChangeLog:
  - changeSet:
      id: seed-business-types-from-csv-v1
      author: opao-team
      runOnChange: true # 🔄 Tells Liquibase to re-evaluate if the CSV changes
      changes:
        - loadUpdateData: # 👈 Use this to prevent errors when it re-evaluates
            tableName: business_type
            file: static-data/business_types.csv
            separator: ","
            primaryKey: "business_code"
