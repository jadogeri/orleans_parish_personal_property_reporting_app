databaseChangeLog:
  - changeSet:
      id: seed-user-roles-from-csv-v1
      author: opao-team
      runOnChange: true # 🔄 Tells Liquibase to re-evaluate if the CSV changes
      changes:
        - loadUpdateData: # 👈 Use this to prevent errors when it re-evaluates
            tableName: user_role
            file: static-data/roles.csv
            separator: ","
            primaryKey: "user_role_id"
