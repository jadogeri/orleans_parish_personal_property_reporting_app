databaseChangeLog:
  - changeSet:
      id: seed-user-status-from-csv-v1
      author: opao-team
      runOnChange: true # 🔄 Tells Liquibase to re-evaluate if the CSV changes
      changes:
        - loadUpdateData: # 👈 Use this to prevent errors when it re-evaluates
            tableName: user_status
            file: static-data/user_status.csv
            separator: ","
            primaryKey: "user_status_id"
